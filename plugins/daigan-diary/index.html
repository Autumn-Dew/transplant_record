<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>代肝日记</title>
<style>
:root{--bg-primary:#1a1a1a;--bg-secondary:#222;--bg-sidebar:#2a2a2a;--text-primary:#ddd;--border-color:#444;--btn-hover-bg:#fff;--btn-hover-text:#000;--motion-duration-fast:0.15s;--motion-duration-normal:0.2s;--motion-duration-slow:0.25s;--motion-duration-slower:0.3s;--motion-easing-standard:cubic-bezier(0.2,0,0.2,1);--motion-easing-enter:cubic-bezier(0.25,0,0,1);--motion-easing-spring:cubic-bezier(0.34,1.56,0.64,1);--motion-easing-ease:ease;--motion-btn-hover:all var(--motion-duration-normal);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow:hidden;transition:background var(--motion-duration-slower),color var(--motion-duration-slower)}
.app{width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:16px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;flex-shrink:0}
.header::after{content:"";position:absolute;bottom:0;left:0;width:100%;height:2px;background:var(--border-color);transform:scaleX(0);transition:transform var(--motion-duration-slow) var(--motion-easing-enter)}
.entered .header::after{transform:scaleX(1)}
.header h2{font-size:20px;margin:0 0 4px;font-weight:700;opacity:0;transform:translateY(-10px);letter-spacing:3px;transition:opacity var(--motion-duration-normal),transform var(--motion-duration-normal),letter-spacing var(--motion-duration-slow)}
.entered .header h2{opacity:1;transform:translateY(0);letter-spacing:0}
.desc{font-size:12px;opacity:0;transform:translateY(-6px);transition:opacity var(--motion-duration-fast) .04s,transform var(--motion-duration-fast) .04s}
.entered .desc{opacity:.7;transform:translateY(0)}
.toolbar{display:flex;gap:8px;padding:12px;align-items:center;position:relative;flex-shrink:0}
.toolbar::after{content:"";position:absolute;bottom:0;left:0;width:100%;height:1px;background:var(--border-color);transform:scaleX(0);transition:transform var(--motion-duration-slow) var(--motion-easing-enter)}
.entered .toolbar::after{transform:scaleX(1)}
.spacer{flex:1}
.btn{height:36px;padding:0 14px;border:2px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary);display:flex;align-items:center;gap:6px;cursor:pointer;transition:var(--motion-btn-hover);font-size:13px;font-family:inherit;font-weight:600;opacity:0;transform:scaleX(0);transition:opacity .12s,transform .13s var(--motion-easing-enter),background var(--motion-duration-normal),color var(--motion-duration-normal)}
.btn:nth-child(1){transition-delay:.08s}.btn:nth-child(2){transition-delay:.13s}.btn:nth-child(3){transition-delay:.18s}
.entered .btn{opacity:1;transform:scaleX(1)}
.btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text)}
.btn.accent{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-bg)}
.btn.red{border-color:#ef5350;color:#ef5350}.btn.red:hover{background:#ef5350;color:#fff}
.search-box{display:flex;align-items:center;gap:4px;height:36px;padding:0 8px;border:2px solid var(--border-color);background:var(--bg-secondary);flex-shrink:0;opacity:0;transform:translateX(8px);transition:opacity var(--motion-duration-fast) .24s,transform var(--motion-duration-fast) .24s}
.entered .search-box{opacity:1;transform:translateX(0)}
.search-input{border:none;background:transparent;color:var(--text-primary);font-size:12px;outline:none;width:160px;font-family:inherit}
.search-input::placeholder{color:var(--text-primary);opacity:.4}
.head-row{height:40px;display:flex;align-items:center;padding:0 12px;background:var(--bg-sidebar);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:1;flex-shrink:0}
.ch{font-size:13px;font-weight:600;opacity:.6;text-align:center;flex-shrink:0}
.c{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;flex-shrink:0}
.c-chk{width:36px;cursor:pointer;font-size:16px;transition:transform var(--motion-duration-normal) var(--motion-easing-spring)}.c-chk:hover{transform:scale(1.25)}
.c-acct{width:130px;position:relative}.c-game{width:70px;font-weight:600}.c-svc{width:100px;font-weight:700}
.c-fee{width:68px;text-align:right;font-family:monospace;font-size:12px}.c-note{width:90px;opacity:.5;font-size:12px}.c-days{width:60px}.c-act{width:80px;display:flex;gap:4px;justify-content:center}.c-detail{width:50px}
.badge{position:absolute;top:-6px;right:2px;min-width:16px;height:16px;background:var(--btn-hover-bg);color:var(--btn-hover-text);font-size:9px;font-family:monospace;line-height:16px;text-align:center;padding:0 3px;border:1px solid var(--border-color)}
.data-list{flex:1;overflow-y:auto;scrollbar-width:none}.data-list::-webkit-scrollbar{display:none}
.row{height:52px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-color);position:relative;z-index:0;opacity:0;transform:translateX(-20px);transition:opacity var(--motion-duration-fast) var(--motion-easing-standard),transform var(--motion-duration-fast) var(--motion-easing-standard)}
.entered .row{opacity:1;transform:translateX(0)}
.row::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--btn-hover-bg);transform:scaleX(0);transform-origin:center;transition:transform var(--motion-duration-slow) var(--motion-easing-ease)}
.row:hover::before{transform:scaleX(1)}.row:hover{color:var(--btn-hover-text)}.row:hover .badge{background:var(--btn-hover-text);color:var(--btn-hover-bg);border-color:var(--btn-hover-bg)}
.row.done{opacity:.45}.row.done:hover{opacity:1}
.mb{width:30px;height:30px;border:2px solid var(--border-color);background:var(--bg-secondary);color:var(--text-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--motion-btn-hover);font-size:12px;font-family:inherit;padding:0;flex-shrink:0}
.mb:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-text)}
.mb.red{color:#ef5350;border-color:#ef5350}.mb.red:hover{background:#ef5350;color:#fff}
.empty-state{display:none;padding:40px 0;flex-direction:column;align-items:center;opacity:.5}
.empty-state.show{display:flex}.empty-state svg{width:50px;height:50px;margin-bottom:12px;fill:none;stroke:currentColor}
.modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
.modal.open{display:flex}
.modal-box{width:580px;background:var(--bg-primary);color:var(--text-primary);border:2px solid var(--border-color);padding:20px;max-height:90vh;overflow-y:auto;animation:modal-in var(--motion-duration-slow) var(--motion-easing-spring)}
@keyframes modal-in{from{opacity:0;transform:scale(.92) translateY(-12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-box h4{margin:0 0 14px;font-size:16px;font-weight:700}
.f-row{display:flex;gap:10px;margin-bottom:8px;align-items:center}
.f-row label{width:64px;font-size:12px;opacity:.5;text-align:right;flex-shrink:0}
.f-row input,.f-row select{flex:1;height:32px;padding:0 8px;font-size:12px;font-family:inherit;background:var(--bg-secondary);color:var(--text-primary);border:2px solid var(--border-color);outline:none;min-width:0}
.f-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}.ditem{display:flex;gap:8px;font-size:13px}.ditem span:first-child{opacity:.5;flex-shrink:0}
</style></head>
<body>
<div class="app entered" id="app">
<div class="header"><div><h2>代肝日记</h2><div class="desc" id="stats"></div></div></div>
<div class="toolbar">
<button class="btn accent" onclick="openEdit()">+ 添加老板</button>
<button class="btn" onclick="resetToday()">重置今日</button>
<button class="btn red" onclick="if(confirm("清空？")){db=[];persist()}">清空</button>
<div class="spacer"></div>
<div class="search-box"><input class="search-input" id="filter" placeholder="搜索..." oninput="render()"></div>
</div>
<div class="head-row"><div class="ch c-chk">完成</div><div class="ch c-acct">账号</div><div class="ch c-game">游戏</div><div class="ch c-svc">服务</div><div class="ch c-note">备注</div><div class="ch c-fee">总收费</div><div class="ch c-fee">实收</div><div class="ch c-fee">延后</div><div class="ch c-days">天数</div><div class="ch c-detail">详情</div><div class="ch c-act">操作</div></div>
<div class="data-list" id="list"></div>
<div class="empty-state" id="empty">暂无记录</div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><h4 id="modalTitle"></h4><div id="modalBody"></div><div class="f-acts"><button class="btn" onclick="closeModal()">取消</button><button class="btn accent" id="modalSave">确定</button></div></div></div>
<div class="modal" id="detailModal" onclick="if(event.target===this)closeDetail()"><div class="modal-box"><h4>老板详情</h4><div id="detailBody"></div><div class="f-acts"><button class="btn" onclick="closeDetail()">关闭</button><button class="btn" onclick="editFromDetail()">编辑</button></div></div></div>
<script>
var KEY="daigan_diary_data",bridge=false,db=[],detailIdx=-1;
var LAB={bilibili:"B站",xiaohongshu:"小红书",douyin:"抖音",wechat:"微信",qq:"QQ",officialAccount:"官服账号",bAccount:"B服账号",password:"密码",game:"游戏",service:"服务项目",note:"备注",totalFee:"总收费",paidFee:"实收",deferredFee:"延后收费",days:"天数"};
var EF=["bilibili","xiaohongshu","douyin","wechat","qq","officialAccount","bAccount","password","game","service","note","totalFee","paidFee","deferredFee","days"];
var SVC=["基建代肝","打boss","肉鸽","普托","红丝绒全包","日常托管","剿灭","活动全包"],editIdx=-1;
(function(){var m=location.search.match(/theme=(\w+)/);if(m)document.getElementById("app").className="app entered "+(m[1]==="light"?"light":"dark")})();
window.addEventListener("message",function(e){if(!e.data||!e.data.type)return;if(e.data.type==="rhizome:theme"){var v=e.data.vars||{},r=document.documentElement;for(var k in v)r.style.setProperty(k,v[k]);document.getElementById("app").className="app entered "+(e.data.dark?"dark":"light")}if(e.data.type==="rhizome:storage"){bridge=true;if(e.data.data&&e.data.data[KEY])try{db=JSON.parse(e.data.data[KEY])}catch(e){}if(!db.length)db=seed();render()}});
function load(){try{var l=localStorage.getItem(KEY);if(l)db=JSON.parse(l)}catch(e){}if(!db.length)db=seed();render()}
function persist(){var j=JSON.stringify(db);if(bridge){var d={};d[KEY]=j;window.parent.postMessage({type:"rhizome:save",data:d},"*")}else try{localStorage.setItem(KEY,j)}catch(e){}render()}
function seed(){return[
{done:1,b:"",x:"Cu_33",d:"",w:"Cu_33",q:"",o:"",ba:"",p:"",g:"终末地",s:"基建代肝",n:"",tf:"100",pf:"",df:"",dy:""},
{done:0,b:"",x:"",d:"",w:"manthyyy",q:"",o:"",ba:"",p:"",g:"终末地",s:"基建代肝",n:"",tf:"",pf:"",df:"",dy:""},
{done:1,b:"",x:"",d:"",w:"connor",q:"",o:"",ba:"",p:"",g:"终末地",s:"基建代肝",n:"",tf:"50",pf:"",df:"",dy:""},
{done:1,b:"",x:"小明忧",d:"",w:"",q:"",o:"",ba:"",p:"",g:"终末地",s:"打boss",n:"无偿帮做",tf:"",pf:"",df:"",dy:""},
{done:0,b:"渡伯",x:"",d:"",w:"",q:"",o:"",ba:"",p:"",g:"明日方舟",s:"普托",n:"",tf:"30",pf:"10",df:"20",dy:""}
].map(function(r){return{done:!!r.done,bilibili:r.b||"",xiaohongshu:r.x||"",douyin:r.d||"",wechat:r.w||"",qq:r.q||"",officialAccount:r.o||"",bAccount:r.ba||"",password:r.p||"",game:r.g||"",service:r.s||"",note:r.n||"",totalFee:r.tf||"",paidFee:r.pf||"",deferredFee:r.df||"",days:r.dy||""}})}
function esc(s){var e=document.createElement("span");e.textContent=s||"";return e.innerHTML}
function fee(v){return v?"¥"+v:""}
function acct(r){var o=r.officialAccount,ba=r.bAccount,a=o||ba;if(!a)return"";var t="";if(o&&ba)t="官/B";else if(o)t="官";else t="B";return a+'<span class="badge">'+t+"</span>"}
function acctFull(r){var s=[];if(r.officialAccount)s.push("官服: "+r.officialAccount);if(r.bAccount)s.push("B服: "+r.bAccount);var pw=r.password?" / 密码: "+r.password:"";return(s.join(" | ")+pw)||"-"}
function render(){
var f=(document.getElementById("filter").value||"").toLowerCase();
var list=db;if(f)list=db.filter(function(r){return["game","service","note","officialAccount","bAccount","bilibili","xiaohongshu","douyin","wechat","qq"].some(function(k){return(r[k]||"").toLowerCase().indexOf(f)>=0})});
var done=list.filter(function(r){return r.done}).length;
document.getElementById("stats").textContent="共 "+db.length+" 位老板 · 今日完成 "+done+" / "+list.length;
var el=document.getElementById("list"),em=document.getElementById("empty");
if(!list.length){el.innerHTML="";em.className="empty-state show";return}
em.className="empty-state";
el.innerHTML=list.map(function(r,i){var idx=db.indexOf(r);return'<div class="row'+(r.done?" done":"")+'" style="transition-delay:'+(i*.023)+'s"><div class="c c-chk" onclick="tgl('+idx+')">'+(r.done?"☑":"○")+'</div><div class="c c-acct">'+acct(r)+'</div><div class="c c-game">'+esc(r.game)+'</div><div class="c c-svc">'+esc(r.service)+'</div><div class="c c-note">'+esc(r.note)+'</div><div class="c c-fee">'+fee(r.totalFee)+'</div><div class="c c-fee">'+fee(r.paidFee)+'</div><div class="c c-fee">'+fee(r.deferredFee)+'</div><div class="c c-days">'+esc(r.days)+'</div><div class="c c-detail"><button class="mb" onclick="openDetail('+idx+')" title="详情">..</button></div><div class="c c-act"><button class="mb" onclick="openEdit('+idx+')">E</button><button class="mb red" onclick="del('+idx+')">X</button></div></div>'}).join("")}
function tgl(i){db[i].done=!db[i].done;persist()}
function del(i){if(confirm("删除？")){db.splice(i,1);persist()}}
function resetToday(){db.forEach(function(r){r.done=false});persist()}
function openEdit(idx){editIdx=idx!=null?idx:-1;var r=editIdx>=0?db[editIdx]:{};document.getElementById("modalTitle").textContent=editIdx>=0?"编辑老板":"添加老板";var h="";EF.forEach(function(k){if(k==="service"){h+='<div class="f-row"><label>'+LAB.service+'</label><input id="f_service" list="svc-list" value="'+ea(r.service||"")+'"><datalist id="svc-list">'+SVC.map(function(o){return'<option value="'+ea(o)+'">'}).join("")+"</datalist></div>";return}h+='<div class="f-row"><label>'+LAB[k]+'</label><input id="f_'+k+'" value="'+ea(r[k]||"")+'"></div>'});document.getElementById("modalBody").innerHTML=h;document.getElementById("modal").className="modal open";document.getElementById("modalSave").onclick=saveEdit}
function ea(s){return(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function saveEdit(){var d={done:editIdx>=0?db[editIdx].done:false};EF.forEach(function(k){d[k]=document.getElementById("f_"+k)?.value||""});if(editIdx>=0){for(var k in d)db[editIdx][k]=d[k]}else{db.push(d)}persist();closeModal()}
function closeModal(){document.getElementById("modal").className="modal";editIdx=-1}
function openDetail(idx){detailIdx=idx;var r=db[idx];var h='<div class="dgrid">';["bilibili","xiaohongshu","douyin","wechat","qq"].forEach(function(k){h+='<div class="ditem"><span>'+LAB[k]+'</span><span>'+esc(r[k]||"-")+"</span></div>"});h+='<div class="ditem"><span>账号</span><span>'+acctFull(r)+"</span></div><div class="ditem"><span>游戏</span><span>"+esc(r.game||"-")+'</span></div><div class="ditem"><span>服务</span><span>'+esc(r.service||"-")+'</span></div><div class="ditem"><span>备注</span><span>'+esc(r.note||"-")+'</span></div><div class="ditem"><span>总收费</span><span>'+fee(r.totalFee)+'</span></div><div class="ditem"><span>实收</span><span>'+fee(r.paidFee)+'</span></div><div class="ditem"><span>延后</span><span>'+fee(r.deferredFee)+'</span></div><div class="ditem"><span>天数</span><span>'+esc(r.days||"-")+"</span></div></div>";document.getElementById("detailBody").innerHTML=h;document.getElementById("detailModal").className="modal open"}
function closeDetail(){document.getElementById("detailModal").className="modal"}
function editFromDetail(){var i=detailIdx;closeDetail();openEdit(i)}
load()
</script></body></html>
